# Publishing this repository is publishing one jar: `eliot-launcher.jar`, the tool `eliotw` fetches and
# execs. Everything else a build needs comes from the dependency graph, so this is the one binary in the
# system whose location is not derived from anything — which is exactly why it is pinned by hand in each
# consumer's `launcher` line in `eliot.pkg` and why what is attached here has to be right.
#
# The jar is built by this tag's own source, bootstrapped. `./bootstrap` compiles the launcher from the
# tag's `src` with the eliot toolchain its `eliot.pkg` names (stage 0), and that launcher then builds
# the suite and the release jar (stage 1). No published launcher is in the chain, so a release never
# depends on the previous one being able to read this tag's descriptor — which it could not, twice,
# before this existed. The jar that is attached then has to build the suite itself before it is
# published (stage 2): what ships is a launcher that is known to build the repository it came from.
#
# That is also why a release may be incompatible with the one before it — a new descriptor format, a
# changed verb — and still be cut: nothing here runs a published launcher, so nothing here has to be
# able to read this tag.
#
# Dispatched with no tag, it is a dry run of the branch it was dispatched on: every step but the
# publishing one, which is how this workflow is checked without a release to show for it.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish the launcher for. Empty for a dry run of the branch.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    env:
      # Empty on a dry run: a dispatch naming no tag.
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref }}
          # The whole history, so the tag object itself is here to be inspected below.
          fetch-depth: 0

      # A release is an annotated tag on a line branch. The resolver reads the peeled ref, which a
      # lightweight tag does not have, so a lightweight tag is a release no package can ever select.
      # Refuse it here rather than letting it fail at whoever depends on it.
      - name: The tag is annotated
        if: env.TAG != ''
        run: |
          [ "$(git cat-file -t "$TAG")" = tag ] ||
             { echo "::error::$TAG is a lightweight tag; a release must be annotated (git tag -a)."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `target/bootstrap` holds eliot's sources and assets at the tag stage 0 compiles with, and
      # `target/cache` this build's mirrors and plugin assets. Both are keyed on the descriptor, the file
      # that decides which tags get cloned; stage 0's jar is in the first and is recompiled whenever
      # the source it was compiled from differs, which the script checks itself.
      - uses: actions/cache@v4
        with:
          path: |
            target/bootstrap
            target/cache
          key: packages-${{ hashFiles('eliot.pkg') }}
          restore-keys: packages-

      # The suite, as the gate, built by the launcher this tag compiles to. A launcher published from a
      # red commit is the tool every consumer of this tag builds with.
      #
      # Grepping the output rather than trusting the exit code: `eliot build` reports the *compiler's*
      # status, and the runner jar it produced does not register an exit code yet. When it does, this
      # becomes a plain `java -jar target/Runner.jar`.
      - name: The suite is green
        run: |
          mkdir -p out
          ./bootstrap build test
          java -jar target/Runner.jar | tee out/suite.log
          grep -q "all clear" out/suite.log ||
             { echo "::error::the suite is not green"; exit 1; }

      - name: The launcher
        run: |
          ./bootstrap build launcher
          mkdir -p out/release
          cp target/Launcher.jar out/release/eliot-launcher.jar

      # The jar about to be published builds the suite on its own, with nothing from stage 0 left in
      # `target` to hide behind.
      - name: The launcher builds its own repository
        run: |
          rm -f target/Runner.jar
          java -jar out/release/eliot-launcher.jar build test
          java -jar target/Runner.jar | tee out/stage2.log
          grep -q "all clear" out/stage2.log ||
             { echo "::error::the released launcher does not build a green suite"; exit 1; }

      - name: The notes
        run: |
          {
            echo "The launcher \`eliotw\` fetches, bootstrapped from this tag's own source."
            echo
            echo "| asset | sha256 |"
            echo "| --- | --- |"
            (cd out/release && sha256sum eliot-launcher.jar |
               while read -r sum name; do echo "| \`$name\` | \`$sum\` |"; done)
            echo
            echo "A published asset is never replaced. A mistake in one is a new tag."
          } > out/notes.md
          cat out/notes.md

      # `--verify-tag` so a mistyped manual run refuses rather than creating a tag. The upload path is
      # for repeating a run that failed partway; it is not a way to replace an asset somebody may
      # already have fetched, which is what the promise above rules out and a new tag is for.
      - name: The release
        if: env.TAG != ''
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
             gh release edit "$TAG" --notes-file out/notes.md
             gh release upload "$TAG" out/release/eliot-launcher.jar --clobber
          else
             gh release create "$TAG" --verify-tag --title "$TAG" --notes-file out/notes.md \
                out/release/eliot-launcher.jar
          fi
