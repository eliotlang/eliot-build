# Every push is checked the way a release is built: `./bootstrap` compiles the launcher from the pushed
# `src` (stage 0), that launcher builds the suite and a launcher of its own (stage 1), and the launcher
# stage 1 produced builds the suite again (stage 2). A green run therefore says both things a change to
# this tool has to be checked for — the suite passes, and the tool actually runs on the platform — which
# before this was a manual step (`.claude/CLAUDE.md`, "The platform check").
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        with:
          path: |
            target/bootstrap
            target/cache
          key: packages-${{ hashFiles('eliot.pkg') }}
          restore-keys: packages-

      # `test` compiles the suite and runs it (`eliot-test//suite`'s `compiler run` line), and
      # exits with the runner's code, so a failing case fails the step.
      - name: Stage 1 builds a green suite
        run: ./bootstrap test

      - name: Stage 1 builds the launcher
        run: |
          ./bootstrap launcher
          mkdir -p out
          cp target/Launcher.jar out/Launcher.jar

      - name: Stage 2 builds a green suite
        run: |
          rm -f target/Runner.jar
          java -jar out/Launcher.jar test
